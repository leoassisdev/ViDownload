[package]
name = "vidownload"
version = "0.1.0"
description = "HLS/m3u8 video downloader"
authors = ["Leo Assis"]
edition = "2021"

[lib]
name = "vidownload_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["cookies", "stream"] }
url = "2"
thiserror = "2"
aes = "0.8"
cbc = "0.1"
byteorder = "1"
bytes = "1"
regex-lite = "0.1"
tauri-plugin-dialog = "2.7.0"
urlencoding = "2.1.3"
tokio-tungstenite = { version = "0.26", features = ["native-tls"] }
futures-util = "0.3"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"
